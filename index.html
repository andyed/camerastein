<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camerastein — Body Signal Detection</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Controls bar -->
    <div id="controls-bar">
        <h1>camerastein</h1>
        <button class="toggle-btn" id="btn-head" data-mode="head">Head</button>
        <button class="toggle-btn" id="btn-body" data-mode="body">Body</button>
        <button class="toggle-btn" id="btn-hand" data-mode="hand">Hand</button>
        <select id="camera-select"><option value="">Camera...</option></select>
        <label id="overlay-toggle" style="display:flex;align-items:center;gap:4px;font-size:12px;color:#888;cursor:pointer;">
            <input type="checkbox" id="cb-video-overlay" checked> video
        </label>
        <span id="mode-indicator"></span>
        <span id="error-display"></span>
        <span id="fps-display">-- fps</span>
        <button id="gesture-lab-toggle" aria-expanded="false" aria-controls="gesture-lab-panel">gestures</button>
        <button id="benchmark-toggle">bench</button>
    </div>

    <!-- Main visualization area -->
    <div id="main-area">
        <video id="video-feed" autoplay playsinline muted></video>
        <canvas id="skeleton-canvas"></canvas>
    </div>

    <!-- Timeline strip -->
    <div id="timeline-strip">
        <canvas id="timeline-canvas"></canvas>
    </div>

    <!-- Persistent project provenance: visible in every detector and lab mode -->
    <footer id="project-footer">
        <span class="project-provenance">Camerastein is open source.</span>
        <a
            id="github-project-link"
            href="https://github.com/andyed/camerastein"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View the Camerastein project on GitHub (opens in a new tab)"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.23c-3.24.7-3.92-1.38-3.92-1.38-.53-1.35-1.3-1.7-1.3-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.39.97.1-.75.4-1.27.74-1.56-2.59-.3-5.31-1.3-5.31-5.69 0-1.26.45-2.28 1.2-3.08-.12-.3-.52-1.48.11-3.05 0 0 .98-.31 3.16 1.18a10.9 10.9 0 0 1 5.74 0c2.18-1.49 3.16-1.18 3.16-1.18.63 1.57.23 2.75.11 3.05.75.8 1.2 1.82 1.2 3.08 0 4.4-2.73 5.39-5.32 5.68.42.36.79 1.07.79 2.17v3.22c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
            </svg>
            <span>View project on GitHub</span>
            <span class="external-link-mark" aria-hidden="true">↗</span>
        </a>
    </footer>

    <!-- Benchmark panel -->
    <div id="benchmark-panel" class="collapsed"></div>

    <!-- Face gesture recognizer workbench -->
    <aside id="gesture-lab-panel" class="collapsed" aria-label="Face gesture recognizer lab"></aside>

    <!-- Detection library (copied verbatim from psychodeli-webgl-port) -->
    <script src="js/lib/motion-bus.js"></script>
    <script src="js/lib/beat-subdivision.js"></script>
    <script src="js/lib/mediapipe-base-loader.js"></script>
    <script src="js/lib/mediapipe-loader.js"></script>
    <script src="js/lib/pose-loader.js"></script>
    <script src="js/lib/hands-loader.js"></script>
    <script src="js/lib/camera-machine.js"></script>
    <script src="js/lib/camera-resource-policy.js"></script>
    <script src="js/lib/camera-tracking-stats.js"></script>
    <script src="js/lib/shared-camera-manager.js"></script>
    <script src="js/lib/head-bob-detector.js"></script>
    <script src="js/lib/head-bob-detector-mouth-tracking.js"></script>
    <script src="js/lib/body-motion-detector.js"></script>
    <script src="js/lib/hand-pose-detector.js"></script>
    <script src="js/lib/camera-commands.js"></script>

    <!-- DI wiring: ?tasks-vision uses new API, default uses legacy -->
    <script>
        if (new URLSearchParams(location.search).has('tasks-vision')) {
            // Tasks Vision: init is an ES module (dynamic imports)
            const s = document.createElement('script');
            s.type = 'module';
            s.src = 'js/init-tasks-vision.js';
            document.head.appendChild(s);
        } else {
            // Legacy: init is a plain script (IIFE)
            const s = document.createElement('script');
            s.src = 'js/init.js';
            document.head.appendChild(s);
        }
    </script>

    <!-- App modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
